# Auto-loaded by `docker compose` in development.
# Adds source bind-mounts + hot reload on top of the base stack.
# `make prod` bypasses this file (docker compose -f docker-compose.yml ...),
# so anything production needs — including every auth/mail env var — belongs in
# docker-compose.yml, not here.
services:
  backend:
    environment:
      ENVIRONMENT: development   # serve.py runs uvicorn with reload=True
    volumes:
      - ./backend/app:/opt/freeflix/app
      - ./backend/serve.py:/opt/freeflix/serve.py

  frontend:
    command: npm run dev
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      # Anonymous volumes: they survive `docker compose up` recreation, so a new
      # npm dependency (resend, @react-email/*) stays invisible and the mail route
      # fails with MODULE_NOT_FOUND until you `docker compose up -V` or rebuild.
      - /app/node_modules
      - /app/.next
