<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0A0B">
  <title>FRÈ — Offline</title>
  <link rel="icon" href="/icons/favicon-32.png">
  <!--
    Precached by sw.js and shown for any navigation that cannot reach the server. It must
    stand alone: no stylesheet, no script bundle, no web font — none of those are cached
    when this page is needed. Colours are copies of the globals.css tokens.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #0A0A0B; color: #F4F1EA; }
    body {
      display: flex; align-items: center; justify-content: center; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 0 16px;
    }
    .mark {
      font-family: Georgia, "Times New Roman", serif; font-weight: 600;
      font-size: 44px; letter-spacing: 0.12em; color: #C9A86A; margin: 0 0 24px;
    }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 22px; margin: 0 0 8px; }
    p { color: #8C8884; font-size: 15px; line-height: 1.5; margin: 0 0 28px; max-width: 32ch; }
    button {
      font: inherit; font-size: 14px; color: #0A0A0B; background: #C9A86A;
      border: 0; border-radius: 999px; padding: 10px 24px; cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #E7D6AE; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">FRÈ</div>
    <h1>You're offline</h1>
    <p>FRÈ can't reach its server. Check your connection, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
